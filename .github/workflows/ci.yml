name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS bundle
        run: npm run build

      - name: Run quality gate tests
        run: npm test

      - name: Verify compiled CSS is committed
        run: git diff --exit-code public/assets/site.css
